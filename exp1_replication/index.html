<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Social Perception Experiment</title>

    <!-- ── jsPsych core + plugins from CDN ───────────────────────────── -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
    <link rel="shortcut icon" href="#">

    <!-- ── jQuery (required by HeadphoneCheck) ───────────────────────── -->
    <!-- Must be loaded BEFORE headphoneCheck.js                          -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- ── HeadphoneCheck ──────────── -->
    <script src="headphoneCheck.js"></script>
    <link rel="stylesheet" href="HeadphoneCheckStyle.css">

    <style>
        /* ── HeadphoneCheck overrides ────────────────────────────────────
           jsPsych's jspsych.css resets input/label styles globally, which
           breaks HeadphoneCheck's radio buttons. These rules restore them
           inside #hc-container only.
        ────────────────────────────────────────────────────────────────── */
        #hc-container {
            display: block !important;
            min-height: 200px;
            width: 100%;
        }
        #hc-container input[type="radio"] {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: auto !important;
            height: auto !important;
            margin: 4px !important;
        }
        #hc-container label {
            display: inline-block !important;
            pointer-events: auto !important;
            cursor: pointer !important;
        }
        #hc-container button {
            display: inline-block !important;
            pointer-events: auto !important;
            cursor: pointer !important;
            opacity: 1 !important;
        }
        #hc-container audio {
            display: block !important;
            pointer-events: auto !important;
            margin: 10px auto;
        }
        /* ── Video display container ─────────────────────────────────────── */
        #videoContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 650px;
        }

        #videoContainer video {
            width: 800px !important;
            height: 600px !important;
        }

        /* ── Confidence slider styling ───────────────────────────────────── */
        .confidence-slider-wrapper {
            width: 600px;
            margin: 20px auto;
            position: relative;
        }

        .confidence-track {
            width: 100%;
            height: 20px;
            background: #ddd;
            position: relative;
            border-radius: 10px;
        }

        .confidence-handle {
            width: 24px;
            height: 24px;
            background: #4CAF50;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .confidence-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.9em;
            color: #555;
        }

        .movement-warning {
            color: red;
            display: none;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Hidden preload container — populated by JS before experiment runs -->
    <div id="videoPreloadContainer" style="display:none;"></div>

    <!-- Load trial metadata first, then the experiment script -->
    <script src="trial_metadata.js"></script>
    <script src="index.js"></script>
</body>
</html>
